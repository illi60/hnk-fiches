name: XP accounting
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: hnk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/hnk_test
      DIRECT_URL: postgresql://postgres:integration-only@localhost:5432/hnk_test
      AUTH_SECRET: integration-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:xp
      - run: npm run test:xp:integration
      - run: npm run build
